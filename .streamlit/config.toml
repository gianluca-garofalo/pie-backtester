[theme.light]
# a neutral accent: Streamlit's default red reads as "loss" in a finance app
primaryColor = "#24364b"
# Okabe-Ito, colour-blind safe; the orange is darkened for contrast on white, and a darker purple
# comes before vermillion, which was hard to tell from the orange (same order as PIE_COLORS in app.py)
chartCategoricalColors = ["#0072B2", "#B86E00", "#009E73", "#AA4499", "#56B4E9", "#D55E00"]

[theme.dark]
# dark enough for white text on primary buttons (4.5:1 or more; the pale blue gave 2.18:1)
primaryColor = "#3d6a99"
chartCategoricalColors = ["#56B4E9", "#E69F00", "#009E73", "#CC79A7", "#0072B2", "#D55E00"]
