[theme.light]
# a neutral accent: Streamlit's default red reads as "loss" in a finance app
primaryColor = "#24364b"
# Okabe-Ito, colour-blind safe; the orange is darkened for contrast on white
chartCategoricalColors = ["#0072B2", "#B86E00", "#009E73", "#D55E00", "#CC79A7", "#56B4E9"]

[theme.dark]
primaryColor = "#8fb3d9"
chartCategoricalColors = ["#56B4E9", "#E69F00", "#009E73", "#D55E00", "#CC79A7", "#0072B2"]
